name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from the root package.json "packageManager" field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @bio/web typecheck

      - run: pnpm --filter @bio/web build

      - run: pnpm --filter @bio/api typecheck

      - run: pnpm --filter @bio/api test

      - run: pnpm --filter @bio/api build

      - run: pnpm --filter @bio/infra test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/bio-github-deploy
          aws-region: us-east-1

      - name: CDK deploy
        run: pnpm --filter @bio/infra exec cdk deploy --require-approval never
