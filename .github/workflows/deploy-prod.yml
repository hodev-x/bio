# Manual, gated production deploy. Cuts the apex (danielhodeta.com) over to CloudFront. Configure a 'production' GitHub Environment with required reviewers before using.

name: deploy-prod

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # version comes from the root package.json "packageManager" field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # pnpm 11 requires Node >=22.13 (Lambda runtime stays node20)
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @bio/shared exports resolve via its dist/, so build it before any
      # package that imports it.
      - run: pnpm --filter @bio/shared build

      - run: pnpm --filter @bio/shared test

      - run: pnpm --filter @bio/web typecheck

      - run: pnpm --filter @bio/web test

      - run: pnpm --filter @bio/web build

      - run: pnpm --filter @bio/api typecheck

      - run: pnpm --filter @bio/api test

      - run: pnpm --filter @bio/api build

      - run: pnpm --filter @bio/infra test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/bio-github-deploy
          aws-region: us-east-1

      - name: CDK deploy prod
        run: pnpm --filter @bio/infra exec cdk deploy BioStack-prod --require-approval never
